name: CI Pipeline

permissions:
  contents: write
  pull-requests: write


# Triggers for the workflow
on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch: # Allows manual triggering from GitHub UI


# Environment variables available to all jobs
env:
  BRANCH_NAME: "update-submodules_${{ github.sha }}"
  REPO_URL: "github.com/hikka-limoka/Limoka.git" # Repository URL
  GIT_DEPTH: 0 # Fetch full history for Git operations

jobs:
  before:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Generate installation access token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          owner: hikka-limoka
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ env.GIT_DEPTH }}
      - name: Configure Git for github-actions[bot]
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git config --global --list
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install Python dependencies
        run: pip install requests
      - name: Sync master branch and create new branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git fetch origin
          git checkout master
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@${REPO_URL}"
          echo "Synchronizing master with origin/master..."
          git reset --hard origin/master
          echo "Deleting remote branch ${BRANCH_NAME}..."
          git push origin --delete ${BRANCH_NAME} || echo "Branch ${BRANCH_NAME} did not exist or could not be deleted"
          echo "Deleting local branch ${BRANCH_NAME}..."
          git branch -D ${BRANCH_NAME} || echo "Local branch ${BRANCH_NAME} did not exist"
          git checkout -b ${BRANCH_NAME}
          echo "Creating new branch ${BRANCH_NAME}..."
          git push origin ${BRANCH_NAME} --force || echo "Error creating branch"

  update:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: before
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ env.GIT_DEPTH }}
          ref: ${{ env.BRANCH_NAME }}
      - name: Configure Git for github-actions[bot]
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git config --global --list
      - name: Configure Git to ignore file mode changes
        run: git config core.fileMode false
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install Python dependencies
        run: pip install requests
      - name: Debug file changes
        run: |
          git status
          git diff --stat
      - name: Clone and update repositories
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Cloning and updating repositories..."
          python3 clone_repos.py || echo "Error running clone_repos.py, continuing with commit and push"
          git add .
          git commit -m "Added and updated repositories $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes for commit"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@${REPO_URL}"
          git push origin ${{ env.BRANCH_NAME }} --force

  parse:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)
    needs: update
    steps:
      - name: Set branch ref for parse
        id: setref
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "ref=${{ env.BRANCH_NAME }}" >> $GITHUB_OUTPUT
          else
            echo "ref=master" >> $GITHUB_OUTPUT
          fi
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ env.GIT_DEPTH }}
          ref: ${{ steps.setref.outputs.ref }}
      - name: Configure Git for github-actions[bot]
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git config --global --list
      - name: Configure Git to ignore file mode changes
        run: git config core.fileMode false
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Run parse scripts
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Running parse after update..."
          git fetch origin
          git checkout ${{ steps.setref.outputs.ref }}
          git reset --hard origin/${{ steps.setref.outputs.ref }}
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install requests
          python3 parse.py
          git add modules.json
          git commit -m "Updated modules.json after parse $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes for modules.json"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@${REPO_URL}"
          git push origin ${{ steps.setref.outputs.ref }}

  commit:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: parse
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ env.GIT_DEPTH }}
          ref: ${{ env.BRANCH_NAME }}
      - name: Configure Git for github-actions[bot]
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git config --global --list
      - name: Configure Git to ignore file mode changes
        run: git config core.fileMode false
      - name: Debug file changes
        run: |
          git status
          git diff --stat
      - name: Final commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git checkout ${{ env.BRANCH_NAME }}
          git add . || echo "No changes"
          git commit -m "Final commit $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes for final commit"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@${REPO_URL}"
          git push origin ${{ env.BRANCH_NAME }} --force

  create_pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: commit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ env.GIT_DEPTH }}
      - name: Configure Git for github-actions[bot]
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git config --global --list
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH="${{ env.BRANCH_NAME }}"
          TITLE="Update of repositories $(date +'%Y-%m-%d %H:%M:%S')"
          BODY="Automated PR for repository updates and parsing.\n\nChanges:\n- Updated submodules\n- Parsed modules.json"

          RESPONSE=$(curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pulls \
            -d '{
              "title": "'"$TITLE"'",
              "body": "'"$BODY"'",
              "head": "'"$BRANCH"'",
              "base": "master"
            }')

          echo "$RESPONSE" | jq . || echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q '"number"'; then
            echo "Pull Request успешно создан!"
            PR_URL=$(echo "$RESPONSE" | jq -r .html_url)
            echo "Ссылка: $PR_URL"
          else
            echo "Ошибка при создании PR"
            exit 1
          fi

  notify_diffs:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: parse
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install aiohttp
      - name: Send module diffs to channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_UPDATE }}
        run: |
          LAST_COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          if [[ "$LAST_COMMIT_MESSAGE" == Merge* ]]; then
            python3 update_diffs.py --token ${{ secrets.TELEGRAM_BOT_TOKEN }} --chat_id ${{ secrets.TELEGRAM_CHAT_ID_UPDATE }} --base_commit HEAD~1
          fi


  backup:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    needs: parse
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ env.GIT_DEPTH }}
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install Python dependencies
        run: pip install aiohttp
      - name: Run backup script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python backup.py --token ${{ secrets.TELEGRAM_BOT_TOKEN }} --chat_id ${{ secrets.TELEGRAM_CHAT_ID }}
